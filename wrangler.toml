name = "crocodile-bot"
main = "index.js"
compatibility_date = "2025-09-01"

# Один объект на каждую группу — раунд, рейтинг, защита от "одновременных" ответов
[[durable_objects.bindings]]
name = "GAME"
class_name = "CrocodileGame"

# Общий реестр всех групп и лобби Супер-игры (один на весь бот)
[[durable_objects.bindings]]
name = "REGISTRY"
class_name = "ArenaRegistry"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["CrocodileGame"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["ArenaRegistry"]

# Резервная копия статистики (база D1 crocodile-db)
[[d1_databases]]
binding = "DB"
database_name = "crocodile-db"
database_id = "56ba9858-45db-44e7-b332-d07f979d4646"

# Нейросеть Cloudflare: придумывает подсказки для новых слов в режиме «Крокодил ведёт»
[ai]
binding = "AI"

# Каждый час бот проверяет "живые" группы: загадка дня, вечерняя игра, итоги недели
[triggers]
crons = ["0 * * * *"]

[observability]
enabled = true
